openapi: 3.1.0
info:
  title: WAM — WhatsApp Marketing API
  version: 0.1.0
  description: |
    WAM — WhatsApp Marketing. Source of truth for HTTP APIs.

    * UI: `GET /api-docs/` (Swagger UI). Spec: `GET /api-docs/openapi.yaml`
      (alias `GET /openapi.yaml`). Legacy `/swagger*` 301s to `/api-docs/`.
    * Dashboard: `/dashboard /connect /contacts /templates /campaigns /analytics`
      (htmx, no React). Labels are embedded in Contacts (`/contacts#labels`), not a separate nav.
    * Connection pairing (QR/phone/logout/status), number check,
      one-off send, contacts/labels CRUD + import, templates CRUD + duplicate,
      campaigns + worker, per-campaign funnel, account overview, CSV export.
    * Persistence: SQLite (`WAM_DB_PATH`), shared with whatsmeow sqlstore.
      Auth: single admin (`WAM_ADMIN_PASSWORD`), session cookie.
    * SaaS path (Postgres `WAM_DATABASE_URL` + `WAM_APP_DATABASE_URL`):
      DB users + RBAC (`admin`/`user`, permission checks per handler),
      per-request org transactions (fail-closed RLS), per-account grants
      (`/api/v1/grants`, enforced in multi-account), signup/verify/reset,
      invites, multi-org sessions with switcher.
  contact:
    name: WAM
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://wam.example.com
    description: Production
tags:
  - name: System
    description: Liveness, readiness, spec.
  - name: Connection
    description: WhatsApp pairing + status.
  - name: Contacts
    description: Recipients / audiences.
  - name: Groups
    description: Labels for contacts, many-to-many. Managed inside Contacts (`#labels`), API remains at `/groups` for compat.
  - name: Templates
    description: Reusable message blueprints with variables.
  - name: Campaigns
    description: Broadcasts with queue + scheduler.
  - name: Analytics
    description: Delivery funnels over campaign_recipients.
  - name: Messages
    description: Outbound messaging.
  - name: Auth
    description: SaaS identity (signup/login/verify/reset/switch). Replaces single-admin on the Postgres path.
  - name: Members
    description: Team + per-account grants (admin, members:manage).
  - name: Accounts
    description: WhatsApp numbers per org (pair independently; campaigns pin one).
  - name: Billing
    description: Plans, derived usage, subscriptions, invoices (PG SaaS path).
  - name: Ops
    description: API keys, outbound webhooks, audit trail, metrics.
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags: [System]
      operationId: getReady
      summary: Readiness probe
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/connection:
    get:
      tags: [Connection]
      operationId: getConnection
      summary: WhatsApp connection status
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
  /api/v1/connection/qr:
    post:
      tags: [Connection]
      operationId: getQR
      summary: Get pairing QR as PNG data URL
      responses:
        '200':
          description: QR payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRPayload'
        '409':
          description: Already logged in
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: WhatsApp error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/connection/pair:
    post:
      tags: [Connection]
      operationId: pairPhone
      summary: Pair with phone number, returns linking code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '+15551234567' }
      responses:
        '200':
          description: Pairing code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
        '409':
          description: Already logged in
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/connection/logout:
    post:
      tags: [Connection]
      operationId: logout
      summary: Disconnect + wipe session
      responses:
        '204': { description: Logged out }
  /api/v1/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: List contacts
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: group_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A page of contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPage'
    post:
      tags: [Contacts]
      operationId: createContact
      summary: Create contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Phone already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/contacts/import:
    post:
      tags: [Contacts]
      operationId: importContacts
      summary: Bulk import CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReceipt'
  /api/v1/contacts/check:
    post:
      tags: [Contacts]
      operationId: checkContacts
      summary: Check numbers on WhatsApp via IsOnWhatsApp (live, needs connection)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phones]
              properties:
                phones: { type: array, items: { type: string }, maxItems: 50 }
      responses:
        '200':
          description: Check results (unknown/offline numbers report onWhatsApp false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        phone: { type: string }
                        onWhatsApp: { type: boolean }
                        jid: { type: string }
  /api/v1/contacts/{id}:
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Get contact
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '200':
          description: The contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Contacts]
      operationId: updateContact
      summary: Update contact
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Contacts]
      operationId: deleteContact
      summary: Delete contact
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '204': { description: Deleted }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/groups:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: List groups/labels
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Group' }
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create group/label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '409':
          description: Group name already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/groups/{id}:
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Get group
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Groups]
      operationId: updateGroup
      summary: Rename group
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete group
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '204': { description: Deleted }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/groups/{id}/members:
    post:
      tags: [Groups]
      operationId: setGroupMembers
      summary: Replace group membership
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Updated }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: List templates
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
    post:
      tags: [Templates]
      operationId: createTemplate
      summary: Create template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '409':
          description: Template name already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/templates/{id}:
    get:
      tags: [Templates]
      operationId: getTemplate
      summary: Get template
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Templates]
      operationId: updateTemplate
      summary: Update template
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Templates]
      operationId: deleteTemplate
      summary: Delete template
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '204': { description: Deleted }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/templates/{id}/duplicate:
    post:
      tags: [Templates]
      operationId: duplicateTemplate
      summary: Duplicate template
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/campaigns:
    get:
      tags: [Campaigns]
      operationId: listCampaigns
      summary: List campaigns
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: A page of campaigns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPage'
    post:
      tags: [Campaigns]
      operationId: createCampaign
      summary: Create campaign, snapshots audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/campaigns/{id}:
    get:
      tags: [Campaigns]
      operationId: getCampaign
      summary: Get campaign by id
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Campaigns]
      operationId: updateCampaign
      summary: Update draft/scheduled campaign
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Not editable in current status
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Campaigns]
      operationId: deleteCampaign
      summary: Delete campaign with recipients
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '204': { description: Deleted }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/campaigns/{id}/start:
    post:
      tags: [Campaigns]
      operationId: startCampaign
      summary: Start sending
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '202': { description: Started }
        '400':
          description: Illegal transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/campaigns/{id}/pause:
    post:
      tags: [Campaigns]
      operationId: pauseCampaign
      summary: Pause sending
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '202': { description: Paused }
        '400':
          description: Illegal transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/campaigns/{id}/resume:
    post:
      tags: [Campaigns]
      operationId: resumeCampaign
      summary: Resume sending
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '202': { description: Resumed }
        '400':
          description: Illegal transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/campaigns/{id}/cancel:
    post:
      tags: [Campaigns]
      operationId: cancelCampaign
      summary: Cancel campaign
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '202': { description: Cancelled }
        '400':
          description: Illegal transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/campaigns/{id}/recipients:
    get:
      tags: [Campaigns]
      operationId: listRecipients
      summary: List per-recipient delivery states
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Recipients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Recipient' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/analytics/overview:
    get:
      tags: [Analytics]
      operationId: analyticsOverview
      summary: Account-wide funnel + 14-day timeline
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
  /api/v1/campaigns/{id}/export:
    get:
      tags: [Campaigns]
      operationId: exportCampaign
      summary: Download campaign recipients as CSV
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/analytics/campaigns/{id}:
    get:
      tags: [Analytics]
      operationId: analyticsCampaign
      summary: Per-campaign funnel
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '200':
          description: Funnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsFunnel'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/messages/send:
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send one-off message (live, needs connection, 30/min limit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSend'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: Recipient unreachable or send failed
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Register (SaaS path; creates org or joins invite). JSON API or web form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, minLength: 8 }
                invite: { type: string, description: Invite token from /invite/accept }
      responses:
        '201': { description: Created (verify email) }
        '400': { $ref: '#/components/responses/BadRequest' }
  /login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in (requires verified email). JSON API or web form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: OK (sets session cookie) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Email unverified }
  /logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke session. JSON API or web form
      responses:
        '200': { description: OK }
  /forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request reset link (always 200, no enumeration). JSON API or web form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: OK }
  /reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Consume reset token, revoke all sessions. JSON API or web form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Identity + orgs + role
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/switch:
    post:
      tags: [Auth]
      operationId: switchOrg
      summary: Move session to another member org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id]
              properties:
                org_id: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: Not a member }
  /api/v1/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: Members + pending invites (admin)
      responses:
        '200': { description: OK }
        '403': { description: Missing members:manage }
  /api/v1/members/invite:
    post:
      tags: [Members]
      operationId: inviteMember
      summary: Invite by email + role (admin, mails link)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, user], default: user }
      responses:
        '201': { description: Invited }
        '403': { description: Missing members:manage }
  /api/v1/members/{user_id}:
    patch:
      tags: [Members]
      operationId: setMemberRole
      summary: Change role (last-admin guard → 409)
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, user] }
      responses:
        '200': { description: OK }
        '409': { description: Last admin }
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove member + revoke org sessions (last-admin guard → 409)
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }
        '409': { description: Last admin }
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Viewable accounts with live status
      responses:
        '200': { description: OK }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Add a pending account row (pair next; needs accounts:pair)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        '201': { description: Created }
        '403': { description: Missing accounts:pair }
  /api/v1/accounts/{account_id}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: One account (view access)
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Accounts]
      operationId: renameAccount
      summary: Rename (needs accounts:pair)
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        '200': { description: OK }
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Remove row + device (needs accounts:pair)
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }
  /api/v1/accounts/{account_id}/qr:
    post:
      tags: [Accounts]
      operationId: accountQR
      summary: Pairing QR for one account (use access)
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/v1/accounts/{account_id}/pair:
    post:
      tags: [Accounts]
      operationId: accountPair
      summary: Phone linking code for one account (use access)
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '200': { description: OK }
  /api/v1/accounts/{account_id}/logout:
    post:
      tags: [Accounts]
      operationId: accountLogout
      summary: Wipe one account device (use access)
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }
  /api/v1/billing/plan:
    get:
      tags: [Billing]
      operationId: getBillingPlan
      summary: Effective plan + derived usage (+ subscription)
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/billing/plans:
    get:
      tags: [Billing]
      operationId: listBillingPlans
      summary: Tiers cheapest-first
      responses:
        '200': { description: OK }
  /api/v1/billing/subscription:
    post:
      tags: [Billing]
      operationId: setSubscription
      summary: Switch tier as trial (admin, billing:manage; paid activation via gateway webhook)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: Missing billing:manage }
  /api/v1/billing/invoices:
    get:
      tags: [Billing]
      operationId: listInvoices
      summary: Charges newest-first
      responses:
        '200': { description: OK }
  /api/v1/grants:
    get:
      tags: [Members]
      operationId: listGrants
      summary: Account grants for a member (?user_id=, admin)
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
    post:
      tags: [Members]
      operationId: setGrant
      summary: Grant member access to an account (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, account_id, role]
              properties:
                user_id: { type: string }
                account_id: { type: string }
                role: { type: string, enum: [member, viewer] }
      responses:
        '200': { description: OK }
    delete:
      tags: [Members]
      operationId: removeGrant
      summary: Revoke account access (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, account_id]
              properties:
                user_id: { type: string }
                account_id: { type: string }
      responses:
        '204': { description: Revoked }
  /api/v1/audit:
    get:
      tags: [Ops]
      operationId: listAudit
      summary: Audit trail newest-first (admin)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/v1/keys:
    get:
      tags: [Ops]
      operationId: listKeys
      summary: API keys, no secrets (admin, keys:manage)
      responses:
        '200': { description: OK }
    post:
      tags: [Ops]
      operationId: createKey
      summary: Mint credential, raw token shown once (scopes narrow creator perms)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
                expires_at: { type: string, format: date-time }
      responses:
        '201': { description: Created }
  /api/v1/keys/{id}:
    delete:
      tags: [Ops]
      operationId: revokeKey
      summary: Revoke credential (row kept for audit)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
  /api/v1/webhooks:
    get:
      tags: [Ops]
      operationId: listWebhooks
      summary: Outbound targets, no secrets + event catalog
      responses:
        '200': { description: OK }
    post:
      tags: [Ops]
      operationId: createWebhook
      summary: Register https target with event subset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                secret: { type: string, description: HMAC secret for X-Wam-Signature }
                events:
                  type: array
                  items: { type: string, enum: [message.sent, message.delivered, message.read, message.failed, campaign.done] }
      responses:
        '201': { description: Created }
  /api/v1/webhooks/{id}:
    delete:
      tags: [Ops]
      operationId: deleteWebhook
      summary: Remove target
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }
  /metrics:
    get:
      tags: [Ops]
      operationId: getMetrics
      summary: Prometheus-text gauges (any member; scrape with API key)
      responses:
        '200': { description: OK }
components:
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PageCursor:
      name: cursor
      in: query
      schema: { type: string }
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: wam }
    Problem:
      title: RFC 9457 problem+json
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    Connection:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        phone: { type: string, nullable: true }
        pushName: { type: string, nullable: true }
    QRPayload:
      type: object
      required: [qr]
      properties:
        qr: { type: string, description: QR image data URL or pairing string }
        expiresIn: { type: integer }
    Campaign:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [draft, scheduled, sending, paused, done, cancelled] }
        audience:
          type: object
          properties:
            group_ids:
              type: array
              items: { type: string, format: uuid }
            contact_ids:
              type: array
              items: { type: string, format: uuid }
        bodyTemplate: { type: string }
        scheduledAt: { type: string, format: date-time, nullable: true }
        waAccountId: { type: string }
        createdAt: { type: string, format: date-time }
    CampaignCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        bodyTemplate: { type: string, description: 'Supports {{name}} variable' }
        template_id: { type: string, format: uuid, description: 'Optional template to copy body from when bodyTemplate is empty' }
        group_ids:
          type: array
          items: { type: string, format: uuid }
        contact_ids:
          type: array
          items: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time, nullable: true }
        wa_account_id: { type: string, description: 'Sender account; empty resolves to the sole account (400 when ambiguous)' }
    Account:
      type: object
      required: [id, orgId, status]
      properties:
        id: { type: string }
        orgId: { type: string }
        label: { type: string }
        phone: { type: string }
        status: { type: string, enum: [pending, connected, disconnected, logged_out] }
        lastSeenAt: { type: string }
        createdAt: { type: string }
    CampaignPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Campaign' }
        nextCursor: { type: string, nullable: true }
    Recipient:
      type: object
      required: [contact_id, status]
      properties:
        contact_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, sent, delivered, read, failed, replied] }
        error: { type: string, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
    Contact:
      type: object
      required: [id, phone, createdAt]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, description: E.164 phone number, example: '+15551234567' }
        name: { type: string, nullable: true }
        waOk: { type: boolean, nullable: true }
        groups:
          type: array
          items: { $ref: '#/components/schemas/Group' }
        createdAt: { type: string, format: date-time }
    ContactCreate:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: '+15551234567' }
        name: { type: string }
        group_ids:
          type: array
          items: { type: string, format: uuid }
    ContactPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        nextCursor: { type: string, nullable: true }
    ImportReceipt:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer }
        skipped: { type: integer }
    Group:
      type: object
      required: [id, name, contactCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, nullable: true }
        contactCount: { type: integer }
    GroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        color: { type: string }
    Template:
      type: object
      required: [id, name, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        category: { type: string, enum: [marketing, utility, authentication] }
        language: { type: string, example: en }
        header: { type: string, nullable: true }
        body: { type: string }
        footer: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    TemplateCreate:
      type: object
      required: [name, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        body: { type: string }
        category: { type: string, enum: [marketing, utility, authentication] }
        language: { type: string }
    MessageSend:
      type: object
      required: [to, body]
      properties:
        to: { type: string, description: E.164 recipient, example: '+15551234567' }
        body: { type: string, minLength: 1 }
    MessageReceipt:
      type: object
      required: [messageId, status]
      properties:
        messageId: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
    AnalyticsOverview:
      type: object
      properties:
        contacts: { type: integer }
        groups: { type: integer }
        campaigns: { type: integer }
        sent7d: { type: integer }
        deliveryRate: { type: number, nullable: true }
        readRate: { type: number, nullable: true }
        funnel: { $ref: '#/components/schemas/AnalyticsFunnel' }
        timeline:
          type: array
          items:
            type: object
            properties:
              day: { type: string, format: date }
              sent: { type: integer }
              delivered: { type: integer }
              read: { type: integer }
              failed: { type: integer }
    AnalyticsFunnel:
      type: object
      required: [sent, delivered, read, failed]
      properties:
        sent: { type: integer }
        delivered: { type: integer }
        read: { type: integer }
        replied: { type: integer }
        failed: { type: integer }
    Identity:
      type: object
      required: [id, email, orgId, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        orgId: { type: string }
        role: { type: string, enum: [admin, user] }
        orgs:
          type: array
          items:
            type: object
            required: [id, name, role]
            properties:
              id: { type: string }
              name: { type: string }
              role: { type: string, enum: [admin, user] }
    Membership:
      type: object
      required: [userId, orgId, role]
      properties:
        userId: { type: string }
        orgId: { type: string }
        role: { type: string, enum: [admin, user] }
        userEmail: { type: string, format: email }
        userName: { type: string }
        createdAt: { type: string }
    Grant:
      type: object
      required: [userId, accountId, orgId, role]
      properties:
        userId: { type: string }
        accountId: { type: string }
        orgId: { type: string }
        role: { type: string, enum: [member, viewer] }
        grantedBy: { type: string }
        createdAt: { type: string }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Login required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PaymentRequired:
      description: Plan quota exceeded (upgrade)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
