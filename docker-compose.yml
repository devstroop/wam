services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - wam-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Reserved for the sender-scale queue (not yet dialed by the app).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - wam-redis:/data
    restart: unless-stopped

  # Owner-DSN schema migration; must complete before wam boots.
  migrate:
    build: .
    command: ["./wam", "migrate-schema"]
    env_file:
      - .env
    environment:
      WAM_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  wam:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      WAM_ADDR: ":8080"
      WAM_ENV: development
      WAM_PUBLIC_BASE_URL: http://localhost:8080
      WAM_DB_PATH: /data/wam.db
      WAM_DATA_DIR: /data
      # No owner DSN here: the migrate job above owns DDL. Runtime serves via
      # the least-privilege role so RLS bites; owner creds never land on the
      # serving container.
      WAM_APP_DATABASE_URL: postgres://wam_app:wam_app@postgres:5432/postgres?sslmode=disable
      # Session store DSN: owner (whatsmeow creates session tables at runtime).
      WAM_WA_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
    volumes:
      - wam-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  wam-data:
  wam-pgdata:
  wam-redis:
