{{/* public layout — defines "base". Pages define "content". */}}
{{define "base"}}<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{with .Title}}{{.}} · {{end}}{{.AppName}} — {{.AppTagline}}</title>
<meta name="description" content="{{.AppName}} — {{.AppTagline}}" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2316a34a'/%3E%3Cpath d='M7.9 20A9 9 0 1 0 4 16.1L2 22Z' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="/static/css/tokens.css" />
<link rel="stylesheet" href="/static/css/components.css" />
<link rel="stylesheet" href="/static/css/app.css" />
<script>(function(){try{var t=localStorage.getItem('wam:theme');if(t==='light'){document.documentElement.classList.remove('dark');}else if(t==='dark'){document.documentElement.classList.add('dark');}}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-background: hsl(var(--background));
    --color-foreground: hsl(var(--foreground));
    --color-card: hsl(var(--card));
    --color-card-foreground: hsl(var(--card-foreground));
    --color-popover: hsl(var(--popover));
    --color-popover-foreground: hsl(var(--popover-foreground));
    --color-primary: hsl(var(--primary));
    --color-primary-foreground: hsl(var(--primary-foreground));
    --color-secondary: hsl(var(--secondary));
    --color-secondary-foreground: hsl(var(--secondary-foreground));
    --color-muted: hsl(var(--muted));
    --color-muted-foreground: hsl(var(--muted-foreground));
    --color-accent: hsl(var(--accent));
    --color-accent-foreground: hsl(var(--accent-foreground));
    --color-destructive: hsl(var(--destructive));
    --color-destructive-foreground: hsl(var(--destructive-foreground));
    --color-border: hsl(var(--border));
    --color-input: hsl(var(--input));
    --color-ring: hsl(var(--ring));
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@{{.HTMXVersion}}/dist/htmx.min.js" defer></script>
<script src="/static/js/app.js" defer></script>
</head>
<body hx-boost="true" class="public-shell">
<header class="landing-nav">
  <a class="brand-row" href="/" style="margin-bottom:0"><span class="brand-mark">{{template "icon-msg"}}</span><span class="brand-name">{{.AppName}}</span></a>
  <nav class="landing-links">
    {{if .IsDev}}<a class="btn btn-outline btn-sm" href="/api-docs/" target="_blank" rel="noopener">API Docs</a>{{end}}
    <a class="btn btn-sm" href="/dashboard">Dashboard</a>
  </nav>
</header>
<main id="content" class="public-content">
{{template "content" .}}
</main>
<footer class="landing-foot">
  <span>{{.AppName}} · {{.AppTagline}} · {{.Year}}</span>
</footer>
<div id="toasts" aria-live="polite"></div>
</body>
</html>{{end}}
