{{define "content"}}
<section class="card" style="max-width:24rem;margin:3rem auto">
  <div class="card-head" style="align-items:center;text-align:center">
    <span class="brand-mark" style="width:2.5rem;height:2.5rem">{{template "icon-msg"}}</span>
    <p class="card-title">Forgot password</p>
    <p class="card-desc">We’ll email a reset link if the address exists.</p>
  </div>
  <div class="card-body">
    {{if .Sent}}<div role="status" class="alert alert-info">{{template "icon-alert"}}<div class="alert-title">Check your inbox</div>
      <div class="alert-desc">Reset link sent (valid 1 hour).</div>
    </div>{{else}}
    <form method="post" action="/forgot">
      <div class="form-row"><label class="label" for="email">Email</label><input id="email" class="input" name="email"
          type="email" placeholder="you@company.com" autocomplete="email" required /></div>
      <button class="btn btn-block" type="submit">Send reset link</button>
    </form>
    {{end}}
    <p class="card-desc" style="margin-top:1rem;text-align:center"><a href="/login">Back to sign in</a></p>
  </div>
</section>
{{end}}
